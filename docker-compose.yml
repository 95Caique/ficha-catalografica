version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code              # Código fonte
      - sqlite_data:/code/db # Banco SQLite persistente
      - static_volume:/code/static
      - media_volume:/code/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
    restart: unless-stopped

volumes:
  sqlite_data:
  static_volume:
  media_volume:
